name: LANDING redesign QA

on:
  push:
    branches: [sites-redesign]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  static-and-flow-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 -m pip install lxml
      - name: Install isolated QA dependencies
        run: npm install --prefix "$RUNNER_TEMP/landing-qa" --no-save @solana/web3.js@1.98.4
      - name: Source fidelity, routes and content
        run: |
          python3 redesign/qa/verify-migration.py
          python3 redesign/qa/verify-content.py
          python3 redesign/qa/audit-final.py
      - name: Offline wallet contracts and all-page startup
        run: |
          node redesign/qa/test-live-flows.cjs "$RUNNER_TEMP/landing-qa/node_modules/@solana/web3.js/lib/index.iife.min.js"
          node redesign/qa/preproduction-dom-smoke.cjs
  responsive-browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser QA dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/landing-qa" --no-save playwright@1.55.1 @solana/web3.js@1.98.4 html2canvas@1.4.1
          node "$RUNNER_TEMP/landing-qa/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Render every page at six widths without live transactions
        run: |
          export PLAYWRIGHT_MODULE="$RUNNER_TEMP/landing-qa/node_modules/playwright"
          export WEB3_IIFE="$RUNNER_TEMP/landing-qa/node_modules/@solana/web3.js/lib/index.iife.min.js"
          export HTML2CANVAS_FILE="$RUNNER_TEMP/landing-qa/node_modules/html2canvas/dist/html2canvas.min.js"
          node redesign/qa/browser-qa.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: landing-redesign-browser-qa
          path: redesign/qa-output/
          retention-days: 14
